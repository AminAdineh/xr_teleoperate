services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app:/app/teleop/teleimager/src
      - PYTHONDONTWRITEBYTECODE=1
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-preview}
    ports:
      - "3000:3000"
    command: >
      bash -c '
        apt-get update && apt-get install -y --no-install-recommends git build-essential libddsc0t64 cyclonedds-dev && rm -rf /var/lib/apt/lists/* ;
        bash scripts/setup_dev.sh ;
        python -m pytest tests/ -v --tb=short 2>&1 | tee /app/test_results.txt ;
        echo "---TESTS DONE---" ;
        python /app/dev_server.py
      '
    tty: true
    stdin_open: true
