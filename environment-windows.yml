# Conda environment for xr_teleoperate on Windows 11
# Create with: conda env create -f environment-windows.yml
# Activate with: conda activate xr_teleoperate

name: xr_teleoperate

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  
  # Scientific stack (install via conda for reliable Windows wheels)
  - pinocchio>=2.7.0
  - nlopt>=2.6.1,<2.8.0
  - numpy>=1.21,<2.0.0
  - scipy>=1.10.0
  - casadi>=3.6.0
  - opencv>=4.8.0
  
  # Communication
  - pyzmq>=25.0.0
  - pyyaml>=6.0
  
  # Visualization
  - matplotlib>=3.7.0
  - meshcat>=0.3.2
  
  # System utilities
  - psutil>=5.9.0
  
  # Pip-only packages (no conda package or specific version needed)
  - pip:
    - logging-mp>=0.3.0
    - sshkeyboard>=2.3.1
    - vuer[all]==0.0.60
    - rerun-sdk>=0.20.0
    - pytransform3d>=3.5.0
    - trimesh>=4.4.0
    - anytree>=2.12.0
    - lxml>=5.2.2
    - torch>=2.0.0
    - aiortc>=1.6.0
    - aiohttp>=3.8.0
